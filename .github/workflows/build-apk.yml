name: Build Android APK

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      create_release:
        description: 'Publish as a GitHub Release?'
        required: true
        type: boolean
        default: true
      backend_url:
        description: 'Backend API URL'
        required: false
        type: string
        default: 'https://goli-transit-backend.onrender.com'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend & Sync Capacitor
        working-directory: ./frontend
        env:
          VITE_BACKEND_ENDPOINT: ${{ inputs.backend_url || vars.VITE_BACKEND_ENDPOINT || 'https://goli-transit-backend.onrender.com' }}
          VITE_API_TIMEOUT_MS: '20000'
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for distribution
        run: |
          mkdir -p release-artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Goli-Transit.apk

      - name: Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Goli-Transit-APK
          path: release-artifacts/Goli-Transit.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/Goli-Transit.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
